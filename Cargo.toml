[package]
name = "jpx"
version = "1.0.0"
edition = "2021"
description = "JPX Programming Language Interpreter - Rewritten in Rust"

[lib]
name = "jpx"
path = "src/lib.rs"

[[bin]]
name = "jpx"
path = "src/main.rs"

[[bin]]
name = "jpxkg"
path = "src/jpxkg.rs"

[dependencies]
regex      = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
sha1       = "0.10"
md-5       = "0.10"
sha3       = "0.10"
blake2     = "0.10"
base64     = "0.22"
hex        = "0.4"
rand       = "0.8"
chrono     = "0.4"
reqwest    = { version = "0.12", features = ["blocking", "json"] }
urlencoding= "2"
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
crc32fast  = "1"

[profile.release]
opt-level = 3
